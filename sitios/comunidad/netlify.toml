# Sitio: reviondo-comunidad · https://reviondo-comunidad.netlify.app
# La puerta de entrada a su comunidad. Es pública: su página del retiro enlaza
# aquí con ?p=modo-avion, ?p=gestalt o ?p=desconexion.
#
# En Netlify, al enlazar el repositorio: Base directory = sitios/comunidad.
# Lo demás lo pone este archivo. Solo se publica public/ (un único index.html).
# Netlify solo reconstruye este sitio si cambia algo dentro de esta carpeta.

[build]
  publish = "public"
  # Solo se publica si cambia algo dentro de esta carpeta. Sin esto, el
  # 27/10 un push a main que solo tocaba CLAUDE.md publicó los tres sitios
  # (15 créditos cada uno). Sale 0 = sin cambios = Netlify no publica.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Su QR (27/10) ───────────────────────────────────────────────────────────
# Un solo QR y un solo enlace: reviondo-comunidad.netlify.app/qr. El QR impreso
# no cambia nunca; lo que cambia es adónde lleva: la línea `to` (y publicar).
# Desde el 27/10 lleva a su Instagram (lo pidió ella). Para que su panel cuente
# a quien llega por el QR, el `to` sería "/?c=qr": el formulario guarda la
# dirección entera en `origen`. El día de su puerta, su dirección con ?c=qr.
# 302 y no 301: un 301 se queda guardado en el móvil de quien ya lo escaneó, y
# luego cambiar el destino no le llegaría.
[[redirects]]
  from = "/qr"
  to = "https://www.instagram.com/reviondo.r/"
  status = 302
