# Su página de venta del RETIRO que toca vender ahora (hoy, febrero de 2027).
# No es su web principal: esa es otra (conversación «Web Principal» y la puerta,
# documento 8). En cada edición cambian fecha, precios, plazas, casa e incluye.
# Es pública: se manda por WhatsApp y por redes.
#
# Sitio previsto: reviondo-modo-avion · https://reviondo-modo-avion.netlify.app
# (falta que Sara confirme que va en esa dirección).
#
# OJO: este sitio está en la cuenta de Netlify de VIBRA, no en la de Sara, y NO
# está enlazado a este repositorio. Un merge a `main` no lo publica. Para
# publicarlo hay que subir public/index.html a mano en ese sitio, o pasar el
# sitio a la cuenta de Sara (la dirección no cambia) y enlazarlo con
# Base directory = sitios/modo-avion. Lo decide Sara.
#
# Solo se publica public/ (un único index.html, con las fotos dentro).

[build]
  publish = "public"
  # Como los otros tres: solo se publica si cambia algo dentro de esta carpeta.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
