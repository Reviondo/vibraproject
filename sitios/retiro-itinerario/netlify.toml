# Sitio: reviondo-retiro-itinerario · https://reviondo-retiro-itinerario.netlify.app
# El itinerario del retiro. Solo para quien ya tiene plaza: se manda por el
# grupo del retiro junto con el formulario. No se enlaza desde ningún sitio.
#
# En Netlify, al enlazar el repositorio: Base directory = sitios/retiro-itinerario.
# Solo se publica public/ (un único index.html, con las fotos dentro).

[build]
  publish = "public"
  # Solo se publica si cambia algo dentro de esta carpeta. Sin esto, el
  # 27/10 un push a main que solo tocaba CLAUDE.md publicó los tres sitios
  # (15 créditos cada uno). Sale 0 = sin cambios = Netlify no publica.
  # No cuenta este archivo, para que meter esta línea no lo publicara:
  # si solo cambias este archivo, este sitio NO se publica.
  # Sin caché, Netlify da CACHED_COMMIT_REF = COMMIT_REF y el git diff saldría
  # vacío aunque haya cambios: el test de delante hace que entonces SÍ publique.
  ignore = "test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)netlify.toml'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
